name: Резервная копия septik-tmn.ru

on:
  schedule:
    - cron: "30 0 * * *"   # 03:30 по Москве (GitHub может запустить с опозданием)
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      BEGET_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q paramiko
      - name: Запуск бэкапа на хостинге
        run: python3 backup_trigger.py
